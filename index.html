<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Experience</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<audio id="raoneMusic" preload="auto">
    <source src="raone-theme.mp3" type="audio/mpeg">
</audio>

<body>

    <!-- G.ONE HERO MODE -->
<div class="g-one-container" id="gOne">
    <img src="gone.jpg" alt="G.ONE" class="g-one-img">
</div>

<!-- RA.ONE VILLAIN MODE -->
<div class="villain-container" id="villain">

    <img src="ra.one.png" class="villain-img" id="villainImg">

    <div class="energy-beam left-beam"></div>
    <div class="energy-beam right-beam"></div>

</div>

<div class="red-flash" id="redFlash"></div>

<div class="red-flash" id="redFlash"></div>

    <main class="container">

        <div class="top-label">
            <span class="status-dot"></span>
            CHIRAG SYSTEM ONLINE
        </div>

        <div class="reactor">
            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>
            <div class="core"></div>
        </div>

        <h1 class="glitch" data-text="BIRTHDAY PROTOCOL">
            BIRTHDAY PROTOCOL
        </h1>

        <p class="subtitle">
            A SPECIAL SYSTEM HAS BEEN ACTIVATED
        </p>

        <div class="birthday-card">
            <div class="card-line"></div>
            <p>IDENTITY DETECTED</p>
            <h2>HAPPY BIRTHDAY LEGEND</h2>
            <p class="small-text">TODAY IS YOUR SPECIAL DAY</p>
        </div>

        <button id="activateBtn">
            <span>INITIALIZE SURPRISE</span>
            <span class="arrow">➜</span>
        </button>

        <div id="message" class="message">
            <div class="message-box">
                <div class="success">SYSTEM MESSAGE UNLOCKED</div>
                <h2>TERI MA KA BHOSDA</h2>
                <p>CHIRAG SYSTEM HAS SUCCESSFULLY EXECUTED THE PROTOCOL.</p>
                <div class="loader"></div>
            </div>
        </div>

        <footer>
            <span>PROJECT LUCIFER</span>
            <span>POWERED BY CHIRAG-TECH</span>
            <span>© 2026</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
